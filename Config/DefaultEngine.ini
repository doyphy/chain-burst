; 세션 제공자. Null = LAN 비콘 기반(계정·자격증명 불필요), 나중에 EOS 도입 시 Epic 으로 교체.
[OnlineServices]
DefaultServices=Epic

; 세션 버킷을 가르는 빌드 식별자. 지정하지 않으면 엔진이 네트워크 호환 체인지리스트를 쓰는데,
; 그 값은 에디터와 패키징 빌드에서 달라져 서로의 방이 보이지 않는다.
; (EOSGS 는 버킷 커스텀 세팅이 없으면 이 값을 버킷 ID 로 씀 — SessionsEOSGS::CreateSession)
; 네트워크 호환성이 깨지는 변경을 하면 숫자를 올릴 것.
bUseBuildIdOverride=True
BuildIdOverride=1

; EOS 로 바꾸면 반드시 False 로 함께 바꿀 것 (안 그러면 LAN 만 검색됨)
[/Script/ChainBurst.CBSessionSubsystem]
bUseLANSessions=False

; EOS SDK 가 쓸 플랫폼 설정 섹션 이름. 실제 자격증명은 Config/Windows/WindowsEngine.ini 의
; [EOSSDK.Platform.ChainBurst] 에 있고(저장소 제외), 여기서는 그 섹션을 가리키기만 함.
; OSSv1 의 DefaultArtifactName 과 혼동하지 말 것 — OSSv2(OnlineServices)가 읽는 키는 이쪽이다.
[EOSSDK]
DefaultPlatformConfigName=ChainBurst

; EOS 진단 로그. 플랫폼 설정을 못 찾을 때의 실패 메시지가 Verbose 라 켜두지 않으면 보이지 않음.
[Core.Log]
LogEOSSDK=Verbose
LogOnlineServices=Verbose
