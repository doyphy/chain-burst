net.AllowPIESeamlessTravel=1

; 제공자는 런타임에 고름(메인 메뉴의 LAN/EOS 버튼 -> UCBAuthSubsystem::RequestLogin).
; 코드가 GetServices 에 제공자를 직접 넘기므로 이 값은 우리 세션 경로에 쓰이지 않음.
; 그래도 지우지 말 것 — EOnlineServices::Default(255) 는 이 설정으로만 해석되고,
; 해석에 실패하면 None(253) 미만 조건에 걸려 GetServices 가 조용히 null 을 반환함.
[OnlineServices]
DefaultServices=Epic

; 세션 버킷을 가르는 빌드 식별자. 지정하지 않으면 엔진이 네트워크 호환 체인지리스트를 쓰는데,
; 그 값은 에디터와 패키징 빌드에서 달라져 서로의 방이 보이지 않는다.
; (EOSGS 는 버킷 커스텀 세팅이 없으면 이 값을 버킷 ID 로 씀 — SessionsEOSGS::CreateSession)
; 네트워크 호환성이 깨지는 변경을 하면 숫자를 올릴 것.
bUseBuildIdOverride=True
BuildIdOverride=1

; EOS SDK 가 쓸 플랫폼 설정 섹션 이름. 실제 자격증명은 Config/Windows/WindowsEngine.ini 의
; [EOSSDK.Platform.ChainBurst] 에 있고(저장소 제외), 여기서는 그 섹션을 가리키기만 함.
; OSSv1 의 DefaultArtifactName 과 혼동하지 말 것 — OSSv2(OnlineServices)가 읽는 키는 이쪽이다.
[EOSSDK]
DefaultPlatformConfigName=ChainBurst

; EOS 진단 로그. 평소엔 HTTP·P2P·op 상태 전이가 쏟아져 노이즈가 크므로 꺼 둠.
; EOS 쪽 문제를 파야 하면 아래 주석을 풀 것 — 플랫폼 설정을 못 찾을 때의 실패 메시지가
; Verbose 라 켜지 않으면 보이지 않고, NetDriver 의 passthrough 판정은 LogSocketSubsystemEOS 에 있음.
;[Core.Log]
;LogEOSSDK=Verbose
;LogOnlineServices=Verbose
;LogSocketSubsystemEOS=Verbose

; 게임 넷 드라이버를 EOS P2P 로 교체함.
; NetDriverEOS 는 IpNetDriver 를 상속하고, 다음 조건이면 스스로 기존 IP 경로로 넘어감(passthrough) —
;  · 리슨 서버: URL 에 bIsLanMatch 또는 bUseIPSockets 가 있을 때 (LAN 경로가 여기 해당)
;  · 클라이언트: 접속 주소가 "EOS:" 로 시작하지 않을 때
; 그래서 이 설정 하나로 LAN 과 EOS 를 모두 태울 수 있음.
;
; ClearArray 로 배열을 비우므로 Beacon·Demo 드라이버도 함께 다시 넣어야 함(엔진 기본값과 동일).
; 클래스 경로 주의 — 인터넷 자료의 /Script/OnlineSubsystemEOS.NetDriverEOS 는 옛 경로이며,
; 현재는 SocketSubsystemEOS 로 옮겨졌다(BaseEngine.ini 의 ClassRedirects 가 옛 경로를 넘겨줌).
[/Script/Engine.Engine]
!NetDriverDefinitions=ClearArray
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/SocketSubsystemEOS.NetDriverEOS",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")
+NetDriverDefinitions=(DefName="BeaconNetDriver",DriverClassName="/Script/OnlineSubsystemUtils.IpNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")
+NetDriverDefinitions=(DefName="DemoNetDriver",DriverClassName="/Script/Engine.DemoNetDriver",DriverClassNameFallback="/Script/Engine.DemoNetDriver")

; P2P 커넥션은 전용 커넥션 클래스를 써야 함. 지정하지 않으면 기본 IpConnection 이 쓰여 P2P 정리가 되지 않음
[/Script/SocketSubsystemEOS.NetDriverEOS]
NetConnectionClassName="/Script/SocketSubsystemEOS.NetConnectionEOS"

; 커스텀 콜리전 채널.
;
; Weapon(ECC_GameTraceChannel1) — 무기 히트 판정 전용 트레이스 채널.
; 코드에서는 인덱스가 흩어지지 않게 CBCollisionChannels.h 의 별칭으로만 참조할 것.
; DefaultResponse=ECR_Block 으로 해서 무기 트레이스가 콜리전에 막히도록 함. (벽 넘어의 적을 공격하지 못하게)
;
; 주의: 채널은 이름이 아니라 인덱스로 에셋에 저장되므로 순서 변경·삭제 금지.
; 지우면 저장된 콜리전 설정이 엉뚱한 채널로 밀림.
[/Script/Engine.CollisionProfile]
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="Weapon")
